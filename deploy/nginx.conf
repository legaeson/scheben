# Конфигурация Nginx для КрасПесок.рф (Красноярск)
# Разместить в /etc/nginx/sites-available/kraspesok и активировать симлинком в sites-enabled

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xn--80aknctefjc.xn--p1ai www.xn--80aknctefjc.xn--p1ai kraspesok.ru www.kraspesok.ru _;

    # Редирект на HTTPS (раскомментировать после получения SSL-сертификата certbot):
    # return 301 https://$host$request_uri;

    # Заголовки безопасности (Defense-in-depth)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Запрет доступа к скрытым файлам и папкам (кроме ACME challenge для certbot)
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Запрет доступа к системным конфигам, логам, базам данных и резервным копиям
    location ~* \.(env|json|md|conf|service|yml|yaml|log|bat|sh|bak|tmp|sql)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Долговременное кэширование изображений (WebP, JPG, PNG, SVG)
    location /images/ {
        proxy_pass http://127.0.0.1:2000/images/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Сжатие трафика
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
